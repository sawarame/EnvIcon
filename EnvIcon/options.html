<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>EnvIcon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      padding: 2rem;
      min-width: 600px;
    }

    .logo-preview {
      max-width: 150px;
      max-height: 50px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }

    /* Drag and Drop styles */
    .drag-handle {
      cursor: grab;
      display: flex;
      align-items: center;
      padding: 0 10px;
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-right: none;
      color: #6c757d;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .dragging {
      opacity: 0.5;
      background-color: #e9ecef;
    }

    .drag-over {
      border-top: 2px solid #0d6efd !important;
    }

    /* Make text inputs placeholder lighter to distinguish from actual input */
    .form-control::placeholder {
      opacity: 0.4 !important;
    }

    .btn-circle {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0"><img src="./images/icon48.png" alt="EnvIcon Logo"> EnvIcon</h1>
      <select id="languageSelect" class="form-select w-auto">
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>

    <div class="mb-4">
      <h5 data-i18n="title" class="mb-3">Favicon Replacement Settings</h5>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="faviconEnabled" />
        <label class="form-check-label fw-bold" for="faviconEnabled" data-i18n="enableFavicon">
          Enable environment-specific favicon replacement
        </label>
      </div>
    </div>

    <div id="environmentsContainer"></div>

    <div class="d-flex align-items-center gap-2 mt-4">
      <button id="save" class="btn btn-primary" data-i18n="save">Save</button>
      <button id="addEnvironment" class="btn btn-outline-secondary" data-i18n="addEnvironment">+ Add Environment</button>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="saveToast" class="toast align-items-center border-0 fade" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-info-circle-fill me-2" viewBox="0 0 16 16">
            <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
          </svg>
          <span id="toastMessage"></span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" id="closeToast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="js/options.js"></script>
</body>

</html>
